<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>顔診断メーカー</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>顔診断メーカー</h1>
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="photo" accept="image/*" capture="user" required>
        <button type="submit">撮影して診断</button>
    </form>

    {% if image_url %}
    <div class="result">
        <h2>診断結果</h2>
        <img src="{{ image_url }}" class="photo">
        <div class="scroll-text">{{ result_text }}</div>
    </div>
    {% endif %}
</div>
</body>
</html>
